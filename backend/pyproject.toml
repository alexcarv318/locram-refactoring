[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "locram"
version = "0.1.0"
description = "Local SQLite-first Zettelkasten"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "cryptography>=45.0.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "mcp>=2.1.0",
    "pydantic>=2.11.0",
    "python-ulid>=3.0.0",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.35.0",
    "websockets>=15.0.0",
]

[project.scripts]
locram = "api.main:main"
locram-mcp = "mcp_server.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/exceptions",
    "src/interfaces",
    "src/models",
    "src/repositories",
    "src/schemas",
    "src/services",
    "src/api",
    "src/mcp_server",
]

[tool.hatch.build.targets.wheel.force-include]
"src/database.py" = "database.py"
"src/dependencies.py" = "dependencies.py"
"alembic.ini" = "alembic.ini"
"alembic" = "alembic"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TRY", "RUF"]
ignore = ["TRY003", "B008"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
packages = [
    "exceptions",
    "interfaces",
    "models",
    "repositories",
    "schemas",
    "services",
    "api",
    "mcp_server",
]
modules = [
    "database",
    "dependencies",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
